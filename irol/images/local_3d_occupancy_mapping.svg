<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
<defs>
 <marker id="a2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6Z" fill="#334155"/></marker>
 <pattern id="u" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M-3 3L3-3M0 12L12 0M9 15L15 9" stroke="#94A3B8" stroke-width="2"/></pattern>
 <pattern id="vg" width="28" height="28" patternUnits="userSpaceOnUse"><rect width="28" height="28" fill="#DDF3DF"/><path d="M28 0H0V28" fill="none" stroke="#98C89E"/></pattern>
</defs>
<rect width="1600" height="820" fill="#fff"/>
<text x="800" y="50" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#13233F">Target-Centric Local 3D Occupancy Mapping</text>
<text x="800" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#64748B">RGB-D ray carving distinguishes observed free space, first-hit surfaces, and occluded unknown space</text>

<!-- panel 1 -->
<rect x="35" y="115" width="480" height="585" rx="18" fill="#F3F8FD" stroke="#4D83B3" stroke-width="2"/>
<circle cx="70" cy="150" r="22" fill="#2F6FA8"/><text x="70" y="158" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="white">1</text>
<text x="105" y="158" font-family="Arial" font-size="23" font-weight="700" fill="#13233F">Selected Close View</text>
<!-- camera -->
<rect x="80" y="330" width="85" height="62" rx="10" fill="#475569"/><circle cx="165" cy="361" r="26" fill="#1E293B"/><circle cx="165" cy="361" r="12" fill="#60A5FA"/>
<rect x="105" y="392" width="18" height="95" fill="#64748B"/><ellipse cx="114" cy="490" rx="55" ry="17" fill="#94A3B8"/>
<text x="120" y="520" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#334155">Wrist RGB-D</text>
<!-- roi -->
<rect x="265" y="225" width="205" height="315" rx="6" fill="none" stroke="#4E9874" stroke-width="3" stroke-dasharray="10 7"/>
<text x="368" y="210" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#4E9874">Target-centric ROI only</text>
<rect x="330" y="330" width="95" height="115" fill="#5B91C7" stroke="#245E95" stroke-width="3"/><text x="377" y="398" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700" fill="white">T</text>
<rect x="280" y="375" width="70" height="70" fill="#D89545" stroke="#AE6A1B" stroke-width="3"/><text x="315" y="421" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="white">B</text>
<!-- rays -->
<g stroke-width="2"><line x1="180" y1="350" x2="330" y2="340" stroke="#22C55E"/><line x1="180" y1="355" x2="330" y2="380" stroke="#22C55E"/><line x1="180" y1="360" x2="280" y2="400" stroke="#22C55E"/><line x1="180" y1="365" x2="330" y2="430" stroke="#22C55E"/><line x1="180" y1="370" x2="425" y2="360" stroke="#22C55E"/></g>
<g fill="#EF4444"><circle cx="330" cy="340" r="6"/><circle cx="330" cy="380" r="6"/><circle cx="280" cy="400" r="6"/><circle cx="330" cy="430" r="6"/><circle cx="425" cy="360" r="6"/></g>
<rect x="80" y="585" width="390" height="75" rx="12" fill="#E6F0FA"/>
<text x="275" y="615" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#2F6FA8">Map only what manipulation requires</text>
<text x="275" y="640" text-anchor="middle" font-family="Arial" font-size="15" fill="#334155">Target, approach corridor, and nearby object space</text>

<line x1="525" y1="405" x2="580" y2="405" stroke="#334155" stroke-width="3" marker-end="url(#a2)"/>

<!-- panel 2 -->
<rect x="590" y="115" width="430" height="585" rx="18" fill="#F7FAF7" stroke="#4E9874" stroke-width="2"/>
<circle cx="625" cy="150" r="22" fill="#4E9874"/><text x="625" y="158" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="white">2</text>
<text x="660" y="158" font-family="Arial" font-size="23" font-weight="700" fill="#13233F">Ray-Carving Rule</text>
<!-- ray cross sections -->
<text x="625" y="225" font-family="Arial" font-size="16" font-weight="700" fill="#334155">Camera</text>
<polygon points="700,210 730,225 700,240" fill="#475569"/>
<line x1="730" y1="225" x2="935" y2="225" stroke="#CBD5E1" stroke-width="18"/>
<line x1="730" y1="225" x2="850" y2="225" stroke="#4CAF50" stroke-width="18"/>
<rect x="850" y="207" width="22" height="36" fill="#EF4444"/>
<rect x="872" y="207" width="63" height="36" fill="url(#u)"/>
<text x="790" y="265" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#2E7D32">Before first hit</text>
<text x="861" y="285" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#B91C1C">First hit</text>
<text x="905" y="265" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#64748B">Behind hit</text>
<!-- definitions -->
<rect x="630" y="330" width="350" height="70" rx="12" fill="#E4F5E7" stroke="#7FBF87"/>
<rect x="650" y="350" width="28" height="28" fill="#4CAF50"/><text x="700" y="370" font-family="Arial" font-size="18" font-weight="700" fill="#2E7D32">FREE</text><text x="775" y="370" font-family="Arial" font-size="15" fill="#334155">observed ray before hit</text>
<rect x="630" y="420" width="350" height="70" rx="12" fill="#FDE8E7" stroke="#E88D89"/>
<rect x="650" y="440" width="28" height="28" fill="#EF4444"/><text x="700" y="460" font-family="Arial" font-size="18" font-weight="700" fill="#B91C1C">OCCUPIED</text><text x="820" y="460" font-family="Arial" font-size="15" fill="#334155">first observed surface</text>
<rect x="630" y="510" width="350" height="70" rx="12" fill="#F1F3F5" stroke="#AEB7C2"/>
<rect x="650" y="530" width="28" height="28" fill="url(#u)" stroke="#94A3B8"/><text x="700" y="550" font-family="Arial" font-size="18" font-weight="700" fill="#64748B">UNKNOWN</text><text x="812" y="550" font-family="Arial" font-size="15" fill="#334155">unobserved behind hit</text>
<rect x="650" y="610" width="310" height="42" rx="21" fill="#FFF1F0"/>
<text x="805" y="637" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#B91C1C">UNKNOWN ≠ FREE</text>

<line x1="1030" y1="405" x2="1085" y2="405" stroke="#334155" stroke-width="3" marker-end="url(#a2)"/>

<!-- panel 3 -->
<rect x="1095" y="115" width="470" height="585" rx="18" fill="#F8F6FC" stroke="#8062A8" stroke-width="2"/>
<circle cx="1130" cy="150" r="22" fill="#8062A8"/><text x="1130" y="158" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="white">3</text>
<text x="1165" y="158" font-family="Arial" font-size="23" font-weight="700" fill="#13233F">Local Voxel State</text>
<!-- voxel slice -->
<rect x="1150" y="215" width="350" height="350" fill="url(#vg)" stroke="#4E9874" stroke-width="2"/>
<!-- unknown region -->
<rect x="1360" y="215" width="140" height="350" fill="url(#u)" opacity=".85"/>
<!-- occupied surfaces -->
<g fill="#EF6A61" stroke="#B91C1C"><rect x="1304" y="299" width="28" height="28"/><rect x="1332" y="299" width="28" height="28"/><rect x="1304" y="327" width="28" height="28"/><rect x="1332" y="327" width="28" height="28"/><rect x="1276" y="355" width="28" height="28"/><rect x="1304" y="355" width="28" height="28"/></g>
<!-- target and blocker -->
<rect x="1220" y="355" width="84" height="112" fill="#5B91C7" stroke="#245E95" stroke-width="3"/><text x="1262" y="422" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="white">T</text>
<rect x="1304" y="383" width="56" height="84" fill="#D89545" stroke="#AE6A1B" stroke-width="3"/><text x="1332" y="434" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="white">B</text>
<!-- corridor -->
<rect x="1165" y="390" width="175" height="50" fill="#FFFFFF" opacity=".55" stroke="#2563EB" stroke-width="2" stroke-dasharray="8 6"/>
<line x1="1172" y1="415" x2="1210" y2="415" stroke="#2563EB" stroke-width="3" marker-end="url(#a2)"/>
<text x="1245" y="590" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#334155">Grasp corridor</text>
<!-- legend -->
<rect x="1135" y="615" width="390" height="55" rx="10" fill="#EEE9F6"/>
<rect x="1155" y="632" width="20" height="20" fill="#4CAF50"/><text x="1182" y="648" font-family="Arial" font-size="13" fill="#334155">FREE</text>
<rect x="1235" y="632" width="20" height="20" fill="#EF4444"/><text x="1262" y="648" font-family="Arial" font-size="13" fill="#334155">OCCUPIED</text>
<rect x="1350" y="632" width="20" height="20" fill="url(#u)"/><text x="1377" y="648" font-family="Arial" font-size="13" fill="#334155">UNKNOWN</text>
<rect x="1460" y="632" width="20" height="20" fill="#5B91C7"/><text x="1487" y="648" font-family="Arial" font-size="13" fill="#334155">ID</text>
</svg>